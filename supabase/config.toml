# Minimal config for the Supabase CLI. This project targets a HOSTED project
# (no Docker locally), so the CLI is used only for `link` and `db push`.
project_id = "post-sales-outreach"

[db]
major_version = 17

# Lets `supabase db push --include-seed` load the fictional seed data. It refuses
# to run until `npm run db:seed-users` has created the four auth users.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
